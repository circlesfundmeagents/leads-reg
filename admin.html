<style>
  :root{
    --teal-900:#0B211A;
    --teal-800:#0E3A2C;
    --teal-700:#0A5B41;
    --teal-600:#069E6B;
    --emerald-500:#10B981;
    --navy-800:#1E2D8A;
    --gold-500:#FABA23;
    --gold-600:#EDA011;
    --bg:#F5F6F2;
    --surface:#FFFFFF;
    --border:#E3E4DC;
    --text:#10241D;
    --text-soft:#4B5B54;
    --text-faint:#8A968E;
    --danger:#C6402A;
    --radius-s:10px;
    --radius-m:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;}
  h1,h2,h3{font-family:'Sora';color:var(--teal-900);margin:0;}
  button,input,select{font-family:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px;}

  /* Lock screen */
  .lock-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--teal-800),var(--teal-900));}
  .lock-card{background:#fff;border-radius:20px;padding:40px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.3);}
  .lock-card img{height:48px;margin:0 auto 16px;}
  .lock-card h1{font-size:21px;margin-bottom:6px;}
  .lock-card p{color:var(--text-soft);font-size:14px;margin:0 0 20px;}
  .lock-card input{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:15px;margin-bottom:14px;}
  .lock-card button{width:100%;padding:13px;border-radius:10px;border:none;background:var(--teal-600);color:#fff;font-weight:700;font-size:15px;cursor:pointer;}
  .lock-card button:hover{background:var(--teal-700);}
  .lock-error{color:var(--danger);font-size:13.5px;margin-bottom:10px;}

  /* Top bar */
  .topbar{background:var(--teal-900);color:#fff;padding:16px 0;}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;}
  .topbar-brand{display:flex;align-items:center;gap:10px;}
  .topbar-brand img{height:28px;}
  .topbar-brand span{font-family:'Sora';font-weight:800;font-size:16px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .icon-btn:hover{background:rgba(255,255,255,.18);}

  .content{padding:28px 0 60px;}

  /* Stat strip */
  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
  @media(max-width:760px){ .stat-strip{grid-template-columns:1fr 1fr;} }
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px 22px;}
  .stat-card .num{font-family:'Sora';font-weight:800;font-size:26px;color:var(--teal-900);}
  .stat-card .lbl{font-size:13px;color:var(--text-faint);margin-top:2px;font-weight:600;}

  /* Filters */
  .filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px 20px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
  .filter-item{display:flex;flex-direction:column;gap:6px;}
  .filter-item label{font-size:12.5px;font-weight:700;color:var(--text-soft);}
  .filter-item input, .filter-item select{padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;min-width:150px;background:#fff;}
  .filter-item.search{flex:1;min-width:200px;}
  .filter-item.search input{width:100%;}
  .clear-btn{background:none;border:none;color:var(--teal-700);font-weight:700;font-size:13.5px;cursor:pointer;padding:10px 4px;}

  /* Region breakdown */
  .region-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .region-chip{background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--text-soft);cursor:pointer;}
  .region-chip.active{background:var(--teal-900);border-color:var(--teal-900);color:#fff;}

  /* Lead list */
  .lead-list{display:flex;flex-direction:column;gap:12px;}
  .lead-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  .avatar{width:46px;height:46px;border-radius:50%;background:#EDF7F1;color:var(--teal-700);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Sora';flex:none;}
  .lead-main{flex:1;min-width:220px;}
  .lead-main .name{font-weight:700;font-size:16px;}
  .lead-main .meta{color:var(--text-faint);font-size:13px;margin-top:2px;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tag{background:#F1F3EE;color:var(--text-soft);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;}
  .tag.fin-yes{background:#E4F6EC;color:var(--teal-700);}
  .job-snip{color:var(--text-soft);font-size:13.5px;margin-top:8px;max-width:60ch;}
  .lead-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:170px;}
  .status-select{padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);font-size:13.5px;font-weight:600;}
  .wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#1F7A52;color:#fff;border:none;border-radius:9px;padding:10px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;}
  .wa-btn:hover{background:#186A46;}
  .date-stamp{font-size:12px;color:var(--text-faint);}

  .empty-state, .load-state, .err-state{text-align:center;padding:60px 20px;color:var(--text-soft);}
  .err-state{color:var(--danger);}
  .retry-btn{margin-top:14px;background:var(--teal-600);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer;}
</style>
</head>

const STATUSES = ["New","Contacted","Onboarded","Not Interested"];

function IconRefresh(p){
  return <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v6h-6"/></svg>;
}
function IconLock(p){
  return <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>;
}

function initials(f,l){
  return ((f||"").charAt(0) + (l||"").charAt(0)).toUpperCase() || "?";
}

function fmtDate(d){
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  return dt.toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});
}

function waLink(phone){
  const digits = String(phone||"").replace(/[^0-9]/g,"");
  const intl = digits.startsWith("0") ? "234" + digits.slice(1) : digits;
  return `https://wa.me/${intl}`;
}

/* ------------------------------- Lock screen ---------------------------------- */
function LockScreen({onUnlock}) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  function submit(e){
    e.preventDefault();
    if (value === CONFIG.DASHBOARD_PASSPHRASE) { onUnlock(); }
    else setError("That passphrase isn't right. Try again.");
  }
  return (
    <div className="lock-shell">
      <form className="lock-card" onSubmit={submit}>
        <img src={LOGO_ICON} alt="CirclesFundMe"/>
        <h1>Agent Leads Dashboard</h1>
        <p>Enter the dashboard passphrase to continue.</p>
        {error && <div className="lock-error">{error}</div>}
        <input type="password" placeholder="Passphrase" value={value} onChange={e=>setValue(e.target.value)} autoFocus/>
        <button type="submit"><IconLock/> Unlock dashboard</button>
      </form>
    </div>
  );
}

/* -------------------------------- Lead card ------------------------------------ */
function LeadCard({lead, onStatusChange}) {
  const [saving, setSaving] = useState(false);
  async function changeStatus(newStatus){
    setSaving(true);
    await onStatusChange(lead, newStatus);
    setSaving(false);
  }
  return (
    <div className="lead-card">
      <div className="avatar">{initials(lead["First Name"], lead["Last Name"])}</div>
      <div className="lead-main">
        <div className="name">{lead["First Name"]} {lead["Last Name"]}</div>
        <div className="meta">{lead["Phone Number"]} · {lead["City/Town"] ? lead["City/Town"] + ", " : ""}{lead["State"]} · <span className="date-stamp">Applied {fmtDate(lead["Timestamp"])}</span></div>
        <div className="tag-row">
          <span className="tag">{lead["Region"]}</span>
          <span className="tag">{lead["Qualification"] === "Other" ? (lead["Qualification (Other)"] || "Other") : lead["Qualification"]}</span>
          <span className={"tag " + (lead["Worked In Financial Services"] === "Yes" ? "fin-yes" : "")}>
            {lead["Worked In Financial Services"] === "Yes" ? "Has financial services experience" : "No financial services experience"}
          </span>
        </div>
        {lead["Current Job"] && <div className="job-snip">{lead["Current Job"]}</div>}
      </div>
      <div className="lead-actions">
        <select className="status-select" value={lead["Status"] || "New"} disabled={saving} onChange={e=>changeStatus(e.target.value)}>
          {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <a className="wa-btn" href={waLink(lead["Phone Number"])} target="_blank" rel="noopener noreferrer">
          <IconWhatsApp/> Message on WhatsApp
        </a>
      </div>
    </div>
  );
}

/* ---------------------------------- Dashboard ----------------------------------- */
function Dashboard() {
  const [leads, setLeads] = useState([]);
  const [loadState, setLoadState] = useState("loading"); // loading | ready | error
  const [errorMsg, setErrorMsg] = useState("");
  const [search, setSearch] = useState("");
  const [region, setRegion] = useState("");
  const [stateFilter, setStateFilter] = useState("");
  const [qualification, setQualification] = useState("");
  const [finExp, setFinExp] = useState("");
  const [status, setStatus] = useState("");

  async function loadLeads() {
    setLoadState("loading");
    setErrorMsg("");
    try {
      if (CONFIG.APPS_SCRIPT_URL.indexOf("PASTE_YOUR") !== -1) {
        throw new Error("APPS_SCRIPT_URL is not set yet. Paste your Google Apps Script web app URL into CONFIG at the top of this file.");
      }
      const url = CONFIG.APPS_SCRIPT_URL + "?key=" + encodeURIComponent(CONFIG.ADMIN_KEY);
      const res = await fetch(url);
      const data = await res.json();
      if (data.status !== "success") throw new Error(data.message || "The server rejected the request.");
      setLeads(data.data || []);
      setLoadState("ready");
    } catch (err) {
      setErrorMsg(err.message || "Couldn't load leads.");
      setLoadState("error");
    }
  }

  useEffect(() => { loadLeads(); }, []);

  async function handleStatusChange(lead, newStatus) {
    setLeads(prev => prev.map(l => l._row === lead._row ? {...l, Status: newStatus} : l));
    try {
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: "POST",
        headers: {"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({ action:"updateStatus", key: CONFIG.ADMIN_KEY, row: lead._row, newStatus }),
      });
    } catch (err) {
      // revert on failure
      setLeads(prev => prev.map(l => l._row === lead._row ? {...l, Status: lead.Status} : l));
      alert("Couldn't save that status change. Please try again.");
    }
  }

  const states = useMemo(() => {
    const s = new Set(leads.map(l => l["State"]).filter(Boolean));
    return Array.from(s).sort();
  }, [leads]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return leads.filter(l => {
      if (region && l["Region"] !== region) return false;
      if (stateFilter && l["State"] !== stateFilter) return false;
      if (qualification && l["Qualification"] !== qualification) return false;
      if (finExp && l["Worked In Financial Services"] !== finExp) return false;
      if (status && (l["Status"] || "New") !== status) return false;
      if (q) {
        const hay = `${l["First Name"]} ${l["Last Name"]} ${l["Phone Number"]}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a,b) => new Date(b["Timestamp"]) - new Date(a["Timestamp"]));
  }, [leads, search, region, stateFilter, qualification, finExp, status]);

  const regionCounts = useMemo(() => {
    const counts = {};
    leads.forEach(l => { counts[l["Region"]] = (counts[l["Region"]]||0) + 1; });
    return counts;
  }, [leads]);

  const stats = useMemo(() => ({
    total: leads.length,
    newCount: leads.filter(l => (l["Status"]||"New") === "New").length,
    contacted: leads.filter(l => l["Status"] === "Contacted").length,
    onboarded: leads.filter(l => l["Status"] === "Onboarded").length,
  }), [leads]);

  function clearFilters(){
    setSearch(""); setRegion(""); setStateFilter(""); setQualification(""); setFinExp(""); setStatus("");
  }

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="wrap">
          <div className="topbar-brand"><img src={LOGO_ICON} alt=""/><span>Agent Leads Dashboard</span></div>
          <div className="topbar-actions">
            <button className="icon-btn" onClick={loadLeads}><IconRefresh/> Refresh</button>
          </div>
        </div>
      </div>

      <div className="content">
        <div className="wrap">
          {loadState === "loading" && <div className="load-state">Loading leads…</div>}

          {loadState === "error" && (
            <div className="err-state">
              <p>{errorMsg}</p>
              <button className="retry-btn" onClick={loadLeads}>Try again</button>
            </div>
          )}

          {loadState === "ready" && (
            <React.Fragment>
              <div className="stat-strip">
                <div className="stat-card"><div className="num">{stats.total}</div><div className="lbl">Total applicants</div></div>
                <div className="stat-card"><div className="num">{stats.newCount}</div><div className="lbl">New</div></div>
                <div className="stat-card"><div className="num">{stats.contacted}</div><div className="lbl">Contacted</div></div>
                <div className="stat-card"><div className="num">{stats.onboarded}</div><div className="lbl">Onboarded</div></div>
              </div>

              <div className="region-strip">
                {REGIONS.map(r => (
                  <button key={r} className={"region-chip" + (region===r ? " active":"")} onClick={()=>setRegion(region===r ? "" : r)}>
                    {r} {regionCounts[r] ? `(${regionCounts[r]})` : ""}
                  </button>
                ))}
              </div>

              <div className="filter-bar">
                <div className="filter-item search">
                  <label>Search name or phone</label>
                  <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="e.g. Musa or 0803..." />
                </div>
                <div className="filter-item">
                  <label>State</label>
                  <select value={stateFilter} onChange={e=>setStateFilter(e.target.value)}>
                    <option value="">All states</option>
                    {states.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div className="filter-item">
                  <label>Qualification</label>
                  <select value={qualification} onChange={e=>setQualification(e.target.value)}>
                    <option value="">All</option>
                    <option>No Degree</option><option>HND</option><option>BSc</option><option>Masters</option><option>Other</option>
                  </select>
                </div>
                <div className="filter-item">
                  <label>Financial experience</label>
                  <select value={finExp} onChange={e=>setFinExp(e.target.value)}>
                    <option value="">All</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                  </select>
                </div>
                <div className="filter-item">
                  <label>Status</label>
                  <select value={status} onChange={e=>setStatus(e.target.value)}>
                    <option value="">All</option>
                    {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <button className="clear-btn" onClick={clearFilters}>Clear filters</button>
              </div>

              {filtered.length === 0 ? (
                <div className="empty-state">No applicants match these filters yet.</div>
              ) : (
                <div className="lead-list">
                  {filtered.map(lead => (
                    <LeadCard key={lead._row} lead={lead} onStatusChange={handleStatusChange} />
                  ))}
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

function App(){
  const [unlocked, setUnlocked] = useState(false);
  return unlocked ? <Dashboard/> : <LockScreen onUnlock={()=>setUnlocked(true)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    (0, eval)(output);
  })();
</script>
