<style>
  :root{
    --teal-900:#0B211A;
    --teal-800:#0E3A2C;
    --teal-700:#0A5B41;
    --teal-600:#069E6B;
    --emerald-500:#10B981;
    --navy-800:#1E2D8A;
    --navy-900:#161F63;
    --gold-500:#FABA23;
    --gold-600:#EDA011;
    --bg:#FAFAF6;
    --surface:#FFFFFF;
    --border:#E7E4D9;
    --text:#10241D;
    --text-soft:#4B5B54;
    --text-faint:#7C8981;
    --danger:#C6402A;
    --radius-s:10px;
    --radius-m:18px;
    --radius-l:28px;
    --max-w:1140px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    font-size:17px;
    line-height:1.6;
  }
  h1,h2,h3,h4{
    font-family:'Sora',system-ui,sans-serif;
    color:var(--teal-900);
    margin:0 0 .5em 0;
    line-height:1.15;
    font-weight:700;
  }
  p{margin:0 0 1em 0;}
  a{color:inherit;}
  button{font-family:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--max-w);margin:0 auto;padding:0 24px;}
  .section{padding:88px 0;}
  .section-tight{padding:56px 0;}
  @media(max-width:720px){
    .section{padding:56px 0;}
    body{font-size:16px;}
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 28px;
    border-radius:999px;
    font-weight:700;
    font-size:16px;
    border:2px solid transparent;
    cursor:pointer;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease;
    line-height:1;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--gold-500);color:var(--teal-900);}
  .btn-primary:hover{background:var(--gold-600);}
  .btn-outline{background:transparent;color:var(--surface);border-color:rgba(255,255,255,.55);}
  .btn-outline:hover{border-color:#fff;background:rgba(255,255,255,.08);}
  .btn-dark-outline{background:transparent;color:var(--teal-900);border-color:var(--teal-900);}
  .btn-dark-outline:hover{background:var(--teal-900);color:#fff;}
  .btn-whatsapp{background:#1F7A52;color:#fff;}
  .btn-whatsapp:hover{background:#186A46;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.6;cursor:not-allowed;}

  /* ---------- Header ---------- */
  .site-header{
    position:sticky;top:0;z-index:40;
    background:rgba(250,250,246,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .site-header .wrap{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:14px;padding-bottom:14px;
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:none;background:none;padding:0;}
  .brand img{height:34px;width:auto;}
  .brand span{font-family:'Sora';font-weight:800;font-size:19px;color:var(--teal-900);}
  .nav-links{display:flex;align-items:center;gap:28px;}
  .nav-links a{font-size:15px;font-weight:600;color:var(--text-soft);text-decoration:none;cursor:pointer;}
  .nav-links a:hover{color:var(--teal-700);}
  .header-cta{display:flex;align-items:center;gap:18px;}
  .header-cta .btn{padding:11px 20px;font-size:14.5px;}
  @media(max-width:820px){ .nav-links{display:none;} }

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(180deg,var(--teal-800) 0%, var(--teal-700) 62%, var(--teal-600) 100%);
    color:#fff;
    position:relative;
    overflow:hidden;
    padding:72px 0 96px;
  }
  .hero:before{
    content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;
    border-radius:50%;border:1px solid rgba(255,255,255,.14);
  }
  .hero:after{
    content:"";position:absolute;right:-40px;top:60px;width:260px;height:260px;
    border-radius:50%;border:1px solid rgba(255,255,255,.14);
  }
  .hero-grid{
    display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;position:relative;z-index:1;
  }
  @media(max-width:900px){ .hero-grid{grid-template-columns:1fr;} }
  .hero h1{color:#fff;font-size:44px;letter-spacing:-.01em;}
  @media(max-width:560px){ .hero h1{font-size:32px;} }
  .hero .lede{font-size:20px;color:#DDF3E9;font-weight:600;margin-bottom:18px;}
  .hero p.body{color:#CFE7DC;font-size:17px;max-width:52ch;}
  .hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px;}

  .coin-badge{
    width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #0E7C58, #0A5B41 70%);
    border:1px solid rgba(255,255,255,.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:0 auto;position:relative;
  }
  .coin-badge svg{position:absolute;top:0;left:0;}
  .coin-badge .amount{font-family:'Sora';font-weight:800;font-size:34px;color:#fff;}
  .coin-badge .amount small{font-size:16px;font-weight:700;color:var(--gold-500);}
  .coin-badge .label{font-size:13px;color:#BFE3D2;max-width:150px;text-align:center;margin-top:6px;font-weight:600;}

  /* ---------- Generic section headings ---------- */
  .kicker-heading{max-width:640px;margin-bottom:44px;}
  .kicker-heading h2{font-size:32px;}
  .kicker-heading p{color:var(--text-soft);font-size:17px;}
  @media(max-width:560px){ .kicker-heading h2{font-size:26px;} }

  /* ---------- About / vehicles ---------- */
  .about-columns{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;}
  @media(max-width:860px){ .about-columns{grid-template-columns:1fr;} }
  .vehicle-row{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;}
  .vehicle-item{display:flex;flex-direction:column;align-items:center;gap:10px;width:92px;}
  .vehicle-item .ic{
    width:64px;height:64px;border-radius:50%;background:#EDF7F1;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);
  }
  .vehicle-item span{font-size:13.5px;font-weight:600;color:var(--text-soft);text-align:center;}
  .rate-badge{
    display:flex;align-items:center;gap:18px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-m);padding:22px 26px;margin-top:10px;
  }
  .rate-badge .ring{
    width:74px;height:74px;border-radius:50%;flex:none;
    border:6px solid var(--gold-500);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora';font-weight:800;font-size:15px;color:var(--teal-900);
  }
  .rate-badge div p{margin:0;color:var(--text-soft);font-size:15px;}
  .reg-note{font-size:14.5px;color:var(--text-faint);margin-top:22px;}

  /* ---------- Protections ---------- */
  .protect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  @media(max-width:860px){ .protect-grid{grid-template-columns:1fr;} }
  .protect-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:30px 26px;
  }
  .protect-card .ic{
    width:52px;height:52px;border-radius:50%;background:var(--teal-900);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  }
  .protect-card h3{font-size:19px;margin-bottom:8px;}
  .protect-card p{color:var(--text-soft);font-size:15.5px;margin:0;}

  /* ---------- Proof ---------- */
  .proof-section{background:var(--teal-900);color:#fff;}
  .proof-grid{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center;}
  @media(max-width:900px){ .proof-grid{grid-template-columns:1fr;} }
  .proof-section .kicker-heading h2{color:#fff;}
  .proof-section .kicker-heading p{color:#B9CCC2;}
  .proof-photo-frame{
    border-radius:var(--radius-l);overflow:hidden;border:1px solid rgba(255,255,255,.18);
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .proof-photo-frame img{width:100%;height:auto;display:block;}
  .ledger{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-m);padding:24px 26px;margin-top:10px;}
  .ledger-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.22);}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .k{color:#CFE7DC;font-size:15px;}
  .ledger-row .v{font-family:'Sora';font-weight:800;font-size:20px;color:var(--gold-500);white-space:nowrap;}
  .proof-caption{color:#CFE7DC;font-size:15px;margin-top:16px;}

  /* ---------- Role ---------- */
  .role-section .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;}
  @media(max-width:860px){ .role-section .wrap{grid-template-columns:1fr;} }
  .role-points{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;}
  .role-points li{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:var(--text-soft);}
  .role-points li svg{flex:none;margin-top:3px;}
  .code-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:32px;text-align:center;
  }
  .code-card .tag{font-family:'Sora';font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--teal-600);}
  .code-card .fake-code{
    font-family:'Sora';font-weight:800;font-size:30px;color:var(--teal-900);
    border:2px dashed var(--teal-600);border-radius:14px;padding:16px 10px;margin:16px 0;
  }
  .code-card p{color:var(--text-soft);font-size:14.5px;margin:0;}

  /* ---------- Earnings ---------- */
  .earn-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px;}
  @media(max-width:760px){ .earn-grid{grid-template-columns:1fr;} }
  .earn-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:30px 28px;
  }
  .earn-card .tag{display:inline-block;background:#EDF7F1;color:var(--teal-700);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:14px;}
  .earn-card .amount{font-family:'Sora';font-weight:800;font-size:30px;color:var(--teal-900);}
  .earn-card p{color:var(--text-soft);font-size:15.5px;margin-top:10px;}

  .example-box{
    background:var(--teal-900);color:#fff;border-radius:var(--radius-l);
    padding:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;
  }
  @media(max-width:860px){ .example-box{grid-template-columns:1fr;padding:30px 24px;} }
  .example-box h3{color:#fff;font-size:22px;margin-bottom:16px;}
  .example-box .ledger{margin-top:0;}
  .example-box .ledger-row .v{color:var(--gold-500);}
  .potential{
    text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
    border-radius:var(--radius-m);padding:28px 18px;
  }
  .potential .big{font-family:'Sora';font-weight:800;font-size:38px;color:var(--gold-500);}
  .potential p{color:#CFE7DC;font-size:14.5px;margin-top:8px;}

  /* ---------- Manage / Growth ---------- */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;}
  @media(max-width:860px){ .two-col{grid-template-columns:1fr;gap:36px;} }
  .phone-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:26px;
  }
  .phone-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
  .phone-row:last-child{border-bottom:none;}
  .phone-row .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .phone-row .dot.ok{background:var(--emerald-500);}
  .phone-row .dot.warn{background:var(--gold-500);}
  .phone-row .name{font-weight:700;font-size:15px;}
  .phone-row .note{font-size:13px;color:var(--text-faint);}

  .growth-badge{
    display:inline-flex;align-items:center;gap:10px;background:#EDF7F1;color:var(--teal-700);
    font-weight:700;font-size:13.5px;padding:8px 16px;border-radius:999px;margin-bottom:16px;
  }

  /* ---------- Who ---------- */
  .who-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){ .who-list{grid-template-columns:1fr;} }
  .who-list li{
    display:flex;gap:12px;align-items:center;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-s);padding:16px 18px;font-weight:600;font-size:15.5px;
  }

  /* ---------- Final CTA ---------- */
  .final-cta{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
    color:#fff;border-radius:var(--radius-l);padding:56px;text-align:center;
  }
  @media(max-width:640px){ .final-cta{padding:40px 24px;} }
  .final-cta h2{color:#fff;font-size:30px;}
  .final-cta p{color:#C9D0F0;max-width:52ch;margin:0 auto 28px;}

  /* ---------- Footer ---------- */
  footer{background:var(--teal-900);color:#BFD4C9;padding:48px 0 32px;}
  .footer-grid{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;}
  .footer-brand{display:flex;align-items:center;gap:10px;}
  .footer-brand img{height:30px;}
  .footer-brand span{font-family:'Sora';font-weight:800;color:#fff;font-size:17px;}
  footer .tagline{font-size:13.5px;color:#8FA89A;margin-top:8px;max-width:34ch;}
  footer .fine{font-size:13px;color:#7C9587;margin-top:28px;border-top:1px solid rgba(255,255,255,.1);padding-top:20px;}

  /* ---------- Apply form page ---------- */
  .apply-shell{background:var(--bg);min-height:70vh;padding:56px 0 90px;}
  .apply-card{
    max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-l);padding:44px;
  }
  @media(max-width:640px){ .apply-card{padding:26px 20px;border-radius:var(--radius-m);} }
  .back-link{display:inline-flex;align-items:center;gap:8px;color:var(--text-soft);font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;margin-bottom:22px;}
  .back-link:hover{color:var(--teal-700);}
  .apply-card h1{font-size:27px;}
  .apply-card .sub{color:var(--text-soft);font-size:15.5px;margin-bottom:30px;}

  .field{margin-bottom:22px;}
  .field label{display:block;font-weight:700;font-size:15px;margin-bottom:8px;color:var(--teal-900);}
  .field .hint{font-weight:400;color:var(--text-faint);font-size:13px;}
  .field input[type=text], .field input[type=tel], .field select, .field textarea{
    width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);
    font-size:16px;font-family:inherit;background:#fff;color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--teal-600);box-shadow:0 0 0 3px rgba(6,158,107,.15);
  }
  .field textarea{resize:vertical;min-height:96px;}
  .two-field{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:520px){ .two-field{grid-template-columns:1fr;} }

  .segmented{display:flex;gap:10px;}
  .segmented button{
    flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--border);background:#fff;
    font-weight:700;font-size:15px;cursor:pointer;color:var(--text-soft);
  }
  .segmented button.active{background:var(--teal-900);border-color:var(--teal-900);color:#fff;}

  .disclaimer-box{
    background:#F3F7F4;border:1px solid var(--border);border-radius:var(--radius-s);
    padding:18px 20px;font-size:14px;color:var(--text-soft);margin:28px 0 18px;
  }
  .disclaimer-box strong{color:var(--teal-900);}
  .agree-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:26px;}
  .agree-row input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--teal-600);}
  .agree-row label{font-size:14.5px;color:var(--text-soft);}
  .error-text{color:var(--danger);font-size:13.5px;margin-top:6px;}
  .form-error{background:#FBEAE7;border:1px solid #F0C4BC;color:var(--danger);border-radius:10px;padding:14px 16px;font-size:14.5px;margin-bottom:20px;}

  /* ---------- Success page ---------- */
  .success-shell{background:var(--bg);min-height:70vh;padding:80px 0;display:flex;align-items:center;}
  .success-card{max-width:560px;margin:0 auto;text-align:center;}
  .success-icon{
    width:84px;height:84px;border-radius:50%;background:var(--teal-600);
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
  }
  .success-card h1{font-size:28px;}
  .success-card p{color:var(--text-soft);font-size:16px;}
  .success-actions{display:flex;flex-direction:column;gap:12px;margin-top:28px;align-items:center;}
</style>
</head>

/* ---------------------------------- Apply form -------------------------------------- */
const emptyForm = {
  firstName:"", lastName:"", phone:"", state:"", city:"",
  qualification:"", qualificationOther:"", financialExperience:"", jobDescription:"", agree:false,
};

function ApplyForm({go, onSubmitted}) {
  const [form, setForm] = useState(emptyForm);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState("");

  const set = (k,v) => setForm(f => ({...f, [k]: v}));

  function validate() {
    const e = {};
    if (!form.firstName.trim()) e.firstName = "Enter your first name.";
    if (!form.lastName.trim()) e.lastName = "Enter your last name.";
    const phoneDigits = form.phone.replace(/[^0-9+]/g,"");
    if (!/^(\+?234|0)\d{9,10}$/.test(phoneDigits)) e.phone = "Enter a valid Nigerian phone number.";
    if (!form.state) e.state = "Select your state.";
    if (!form.city.trim()) e.city = "Enter your city or town.";
    if (!form.qualification) e.qualification = "Select your highest qualification.";
    if (form.qualification === "Other" && !form.qualificationOther.trim()) e.qualificationOther = "Please specify.";
    if (!form.financialExperience) e.financialExperience = "Select yes or no.";
    if (!form.jobDescription.trim()) e.jobDescription = "Tell us what you currently do.";
    if (!form.agree) e.agree = "You need to agree before submitting.";
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleSubmit(ev) {
    ev.preventDefault();
    setSubmitError("");
    if (!validate()) return;
    setSubmitting(true);
    const payload = {
      firstName: form.firstName.trim(),
      lastName: form.lastName.trim(),
      phone: form.phone.trim(),
      state: form.state,
      region: STATE_REGIONS[form.state] || "",
      city: form.city.trim(),
      qualification: form.qualification,
      qualificationOther: form.qualification === "Other" ? form.qualificationOther.trim() : "",
      financialExperience: form.financialExperience,
      jobDescription: form.jobDescription.trim(),
    };
    try {
      if (CONFIG.APPS_SCRIPT_URL.indexOf("PASTE_YOUR") !== -1) {
        throw new Error("The site owner hasn't connected the Google Sheet yet (APPS_SCRIPT_URL is not set).");
      }
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.status !== "success") throw new Error(data.message || "Something went wrong.");
      onSubmitted(payload);
    } catch (err) {
      setSubmitError(err.message || "We couldn't submit your application. Please check your connection and try again.");
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="apply-shell">
      <div className="wrap">
        <div className="apply-card">
          <button className="back-link" onClick={()=>go('home')}>&larr; Back to home</button>
          <h1>Apply to become an Independent Agent</h1>
          <p className="sub">Takes less than two minutes. No qualification is required to get started.</p>

          {submitError && <div className="form-error">{submitError}</div>}

          <form onSubmit={handleSubmit} noValidate>
            <div className="two-field">
              <div className="field">
                <label>First name</label>
                <input type="text" value={form.firstName} onChange={e=>set('firstName', e.target.value)} />
                {errors.firstName && <div className="error-text">{errors.firstName}</div>}
              </div>
              <div className="field">
                <label>Last name</label>
                <input type="text" value={form.lastName} onChange={e=>set('lastName', e.target.value)} />
                {errors.lastName && <div className="error-text">{errors.lastName}</div>}
              </div>
            </div>

            <div className="field">
              <label>Phone number</label>
              <input type="tel" placeholder="e.g. 0803 123 4567" value={form.phone} onChange={e=>set('phone', e.target.value)} />
              {errors.phone && <div className="error-text">{errors.phone}</div>}
            </div>

            <div className="two-field">
              <div className="field">
                <label>State</label>
                <select value={form.state} onChange={e=>set('state', e.target.value)}>
                  <option value="">Select your state</option>
                  {STATES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                {errors.state && <div className="error-text">{errors.state}</div>}
              </div>
              <div className="field">
                <label>City / Town</label>
                <input type="text" value={form.city} onChange={e=>set('city', e.target.value)} />
                {errors.city && <div className="error-text">{errors.city}</div>}
              </div>
            </div>

            <div className="field">
              <label>Highest educational qualification</label>
              <select value={form.qualification} onChange={e=>set('qualification', e.target.value)}>
                <option value="">Select an option</option>
                {QUALIFICATIONS.map(q => <option key={q} value={q}>{q}</option>)}
              </select>
              {errors.qualification && <div className="error-text">{errors.qualification}</div>}
            </div>

            {form.qualification === "Other" && (
              <div className="field">
                <label>Please specify</label>
                <input type="text" value={form.qualificationOther} onChange={e=>set('qualificationOther', e.target.value)} />
                {errors.qualificationOther && <div className="error-text">{errors.qualificationOther}</div>}
              </div>
            )}

            <div className="field">
              <label>Have you ever worked in financial services?</label>
              <div className="segmented">
                <button type="button" className={form.financialExperience==='Yes' ? 'active':''} onClick={()=>set('financialExperience','Yes')}>Yes</button>
                <button type="button" className={form.financialExperience==='No' ? 'active':''} onClick={()=>set('financialExperience','No')}>No</button>
              </div>
              {errors.financialExperience && <div className="error-text">{errors.financialExperience}</div>}
            </div>

            <div className="field">
              <label>What do you currently do? <span className="hint">(your current job or business)</span></label>
              <textarea value={form.jobDescription} onChange={e=>set('jobDescription', e.target.value)} />
              {errors.jobDescription && <div className="error-text">{errors.jobDescription}</div>}
            </div>

            <div className="disclaimer-box">
              <strong>Before you submit:</strong> Becoming a CirclesFundMe Independent Agent is not subject to any academic or professional qualification. It is based solely on your ability to attract, onboard, and properly manage members. Proper support and training will be provided to help you succeed.
            </div>

            <div className="agree-row">
              <input type="checkbox" id="agree" checked={form.agree} onChange={e=>set('agree', e.target.checked)} />
              <label htmlFor="agree">I understand and agree to the above.</label>
            </div>
            {errors.agree && <div className="error-text" style={{marginTop:'-14px', marginBottom:'20px'}}>{errors.agree}</div>}

            <button className="btn btn-primary btn-block" type="submit" disabled={submitting}>
              {submitting ? "Submitting..." : "Submit application"}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

/* --------------------------------- Success page ---------------------------------- */
function SuccessPage({go, applicant}) {
  const name = applicant ? applicant.firstName : "";
  const message = encodeURIComponent(`Hi, I just applied to become a CirclesFundMe Independent Agent. My name is ${applicant ? applicant.firstName + " " + applicant.lastName : ""}.`);
  const waLink = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${message}`;
  return (
    <div className="success-shell">
      <div className="wrap">
        <div className="success-card">
          <div className="success-icon"><IconCheck size={36} stroke="#fff"/></div>
          <h1>You're in — application received</h1>
          <p>Thank you{name ? `, ${name}` : ""}. Your application has been recorded. Mr. Enoch Shittu, our Director of Partnerships and Independent Agents, will reach out to guide you through the next steps.</p>
          <div className="success-actions">
            <a className="btn btn-whatsapp btn-block" href={waLink} target="_blank" rel="noopener noreferrer"><IconWhatsApp/> Message us on WhatsApp now</a>
            <button className="btn btn-dark-outline" onClick={()=>go('home')}>Back to homepage</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------ App ----------------------------------------- */
function App() {
  const [view, setView] = useState('home');
  const [applicant, setApplicant] = useState(null);

  function go(v, anchor) {
    setView(v);
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
    if (anchor) {
      setTimeout(()=>{
        const el = document.getElementById(anchor);
        if (el) el.scrollIntoView({behavior:'smooth'});
      }, 50);
    }
  }

  return (
    <React.Fragment>
      <Header go={go}/>
      {view === 'home' && <HomePage go={go}/>}
      {view === 'apply' && <ApplyForm go={go} onSubmitted={(data)=>{ setApplicant(data); go('success'); }}/>}
      {view === 'success' && <SuccessPage go={go} applicant={applicant}/>}
      {view === 'home' && <Footer go={go}/>}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

  // Compile the JSX above ourselves, forcing the classic (React.createElement)
  // transform — needed because newer Babel defaults to a transform that relies
  // on ES module imports, which plain <script> tags cannot use.
  (function () {
    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    (0, eval)(output);
  })();
</script>
